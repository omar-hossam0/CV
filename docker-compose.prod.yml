# ==============================================================================
# Lightweight Production Docker Compose (Frontend + Backend + MongoDB)
# Optimized for AWS EC2 Free Tier (t2.micro / t3.micro - 1GB RAM)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Stop:
#   docker compose -f docker-compose.prod.yml down
# ==============================================================================

services:
  # ============================================================
  # Database: MongoDB 7
  # ============================================================
  mongodb:
    image: mongo:7
    container_name: cv-mongodb-prod
    restart: always
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 400M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cv-network

  # ============================================================
  # Backend API: Node.js (Express)
  # Includes built-in JavaScript Hybrid Matcher & Skills Analyzer
  # ============================================================
  backend:
    image: ${DOCKERHUB_USERNAME:-omarhossam0}/omar-cv-backend:latest
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cv-backend-prod
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/cv_project_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 400M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cv-network

  # ============================================================
  # Frontend UI: React SPA (Production Nginx Reverse Proxy)
  # ============================================================
  frontend:
    image: ${DOCKERHUB_USERNAME:-omarhossam0}/omar-cv-frontend:latest
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
    container_name: cv-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 150M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cv-network

# ============================================================
# Persistent Named Volumes
# ============================================================
volumes:
  mongodb_data:
    name: cv_mongodb_data_prod

# ============================================================
# Isolated Bridge Network
# ============================================================
networks:
  cv-network:
    name: cv_network_prod
    driver: bridge
