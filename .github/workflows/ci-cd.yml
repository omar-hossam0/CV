      # ---------- HEALTHCHECK ----------
      - name: Start Model 3 + MongoDB
        run: docker compose -f docker-compose.dev.yml up -d mongodb model-3

      - name: Healthcheck
        run: |
          echo "Waiting for Model 3 to be ready..."
          curl --retry 20 --retry-delay 5 --retry-connrefused -sf http://localhost:5003/health
          echo "✅ Model 3 (Skill Analyzer) is healthy on port 5003"

      - name: Dump Logs on Failure
        if: failure()
        run: docker logs model-3-skill-analyzer 2>&1 || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # ============================================================
  # MODEL 4 - Chat Model - Build → Healthcheck
  # ============================================================
  model-4-ci:
    name: Model 4 CI (Chat Model)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env
        run: echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env

      # ---------- BUILD ----------
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-model-4-${{ hashFiles('docker-compose.dev.yml') }}
          restore-keys: |
            ${{ runner.os }}-docker-model-4-

      - name: Build Docker Image
        run: |
          DOCKER_BUILDKIT=1 docker compose -f docker-compose.dev.yml build \
            --build-arg BUILDKIT_INLINE_CACHE=1 model-4

      # ---------- HEALTHCHECK ----------
      - name: Start Model 4 + MongoDB
        run: docker compose -f docker-compose.dev.yml up -d mongodb model-4

      - name: Healthcheck
        run: |
          echo "Waiting for Model 4 to be ready..."
          curl --retry 20 --retry-delay 5 --retry-connrefused -sf http://localhost:5004/health
          echo "✅ Model 4 (Chat Model) is healthy on port 5004"

      - name: Dump Logs on Failure
        if: failure()
        run: docker logs model-4-chat-model 2>&1 || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    needs:
      - frontend-ci
      - backend-ci
      - model-1-ci
      - model-2-ci
      - model-3-ci
      - model-4-ci
    steps:
      - name: All checks passed
        run: |
          echo "========================================="
          echo "✅ CI PIPELINE PASSED"
          echo "========================================="
          echo "Frontend:  ✅ PASSED"
          echo "Backend:   ✅ PASSED"
          echo "Model 1:   ✅ PASSED"
          echo "Model 2:   ✅ PASSED"
          echo "Model 3:   ✅ PASSED"
          echo "Model 4:   ✅ PASSED"
          echo "========================================="
