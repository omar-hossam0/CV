name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/*"

jobs:
  build-all-images:
    name: Build All Docker Images
    runs-on: ubuntu-24.04
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file for Docker Compose
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

      - name: Build All Docker Images
        run: docker compose -f docker-compose.dev.yml build

      - name: Start All Services
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Wait for MongoDB to be healthy
        run: |
          echo "Waiting for MongoDB healthcheck..."
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' mongodb 2>/dev/null | grep -q healthy; then
              echo "MongoDB is healthy!"
              break
            fi
            echo "Attempt $i/30 - waiting 5s..."
            sleep 5
          done

      - name: Wait for services to start
        run: sleep 20

      - name: Check All Container Status
        run: |
          echo "=== Container Status ==="
          docker compose -f docker-compose.dev.yml ps -a
          echo ""
          echo "=== Checking for crashed containers ==="
          FAILED=0
          for container in backend frontend model-1-cv-matcher model-2-cv-classifier model-3-skill-analyzer model-4-chat-model; do
            STATUS=$(docker inspect -f '{{.State.Status}}' "$container" 2>/dev/null || echo "not_found")
            if [ "$STATUS" != "running" ]; then
              echo "❌ $container is NOT running (status: $STATUS)"
              echo "--- Logs for $container ---"
              docker logs "$container" 2>&1 | tail -30
              echo "---"
              FAILED=1
            else
              echo "✅ $container is running"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "Some containers failed to start!"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
