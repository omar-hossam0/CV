# ============================================================
# CV Matching Platform - CI Pipeline
# First CI implementation: Development-focused validation
# ============================================================
# Triggers on push to main branch only.
# Validates: dependencies, linting, builds, tests, Docker images.
# ============================================================

name: CI

on:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch to save runner time
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Frontend CI
  # Validates: dependency install, lint, production build
  # ============================================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Frontend has eslint configured via eslint.config.js
        # The "lint" script runs: eslint .
        run: npm run lint

      - name: Build for production
        # Vite production build — verifies the project compiles cleanly
        run: npm run build

  # ============================================================
  # Job 2: Backend CI
  # Validates: dependency install, server module loads correctly
  # Note: No test script exists in Backend/package.json.
  #       test_endpoints.js and testDB.js are manual scripts
  #       requiring a running MongoDB and auth tokens.
  # ============================================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No "npm test" or "npm run lint" script exists in Backend/package.json.
      # Instead, verify the server module can be imported without crashing.
      # This catches syntax errors and missing dependency issues.
      - name: Verify server module loads
        run: node -e "import('./server.js').then(() => console.log('✅ Server module loaded successfully')).catch(e => { console.error('❌ Failed to load server:', e.message); process.exit(1); })"
        env:
          # Provide minimal env so dotenv doesn't crash on missing values
          PORT: "5000"
          NODE_ENV: "test"
          MONGODB_URI: "mongodb://localhost:27017/ci_test_db"
          JWT_SECRET: "ci-test-secret-not-for-production"

  # ============================================================
  # Job 3: Models CI (Python)
  # Validates: dependency install, runs existing test_model.py
  # for each model.
  #
  # Model 1 is HEAVY (PyTorch ~2GB + sentence-transformers).
  #   - Uses test_model_fallback.py (TF-IDF only) to avoid
  #     downloading BERT models in CI.
  #   - Full BERT tests require model download and are slow.
  #
  # Model 4 tests use a local fallback when GROQ_API_KEY is
  #   not set, so they pass without secrets.
  # ============================================================
  models-ci:
    name: Models CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- Model 2: CV Classifier (lightweight) ----
      - name: Install Model 2 dependencies
        run: pip install -r requirements.txt
        working-directory: model-2-cv-classifier

      - name: Test Model 2 (CV Classifier)
        run: python test_model.py
        working-directory: model-2-cv-classifier

      # ---- Model 3: Skill Analyzer (lightweight) ----
      - name: Install Model 3 dependencies
        run: pip install -r requirements.txt
        working-directory: model-3-skill-analyzer

      - name: Test Model 3 (Skill Analyzer)
        run: python test_model.py
        working-directory: model-3-skill-analyzer

      # ---- Model 4: Chat Model (medium) ----
      - name: Install Model 4 dependencies
        run: pip install -r requirements.txt
        working-directory: model-4-chat-model

      - name: Test Model 4 (Chat Model)
        run: python test_model.py
        working-directory: model-4-chat-model
        # GROQ_API_KEY not set — local fallback is used automatically

      # ---- Model 1: CV Matcher (HEAVY) ----
      # Install only the lightweight dependencies needed for TF-IDF fallback.
      # torch + sentence-transformers (~2GB) are skipped in CI to keep
      # run times reasonable. The TF-IDF fallback test covers the core
      # matching logic without BERT.
      - name: Install Model 1 dependencies (lightweight)
        run: pip install fastapi uvicorn pydantic numpy scikit-learn
        working-directory: model-1-cv-matcher

      - name: Test Model 1 (CV Matcher — TF-IDF fallback)
        run: python test_model_fallback.py
        working-directory: model-1-cv-matcher

  # ============================================================
  # Job 4: Docker Build Validation
  # Verifies all 6 Dockerfiles can build successfully.
  #
  # TRADEOFF: Model 1's Docker image installs PyTorch CPU (~2GB)
  #   and sentence-transformers. This makes the build slow (~5-10 min)
  #   and the image large (~4GB). This is the reality of the project's
  #   ML dependencies and is not hidden or worked around.
  #
  # Images are built but NOT pushed to any registry.
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    # Only run after models-ci passes (no point building Docker if tests fail)
    needs: [frontend-ci, backend-ci, models-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Lightweight images first (parallel where possible) ----

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: false
          tags: cv-matching/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: false
          tags: cv-matching/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Model 2 image (CV Classifier)
        uses: docker/build-push-action@v6
        with:
          context: ./model-2-cv-classifier
          push: false
          tags: cv-matching/model-2:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Model 3 image (Skill Analyzer)
        uses: docker/build-push-action@v6
        with:
          context: ./model-3-skill-analyzer
          push: false
          tags: cv-matching/model-3:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Model 4 image (Chat Model)
        uses: docker/build-push-action@v6
        with:
          context: ./model-4-chat-model
          push: false
          tags: cv-matching/model-4:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Heavy image last ----

      - name: Build Model 1 image (CV Matcher — HEAVY, includes PyTorch)
        uses: docker/build-push-action@v6
        with:
          context: ./model-1-cv-matcher
          push: false
          tags: cv-matching/model-1:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Validate Docker Compose configuration ----
      # Verifies the compose file is syntactically valid.
      # Does NOT start any services.
      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.dev.yml config --quiet
