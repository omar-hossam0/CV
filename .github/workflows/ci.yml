          done
          docker logs model-3-ci
          exit 1
      - name: Validate model API
        run: |
          curl --fail --silent --request POST http://127.0.0.1:5003/analyze \
            --header 'Content-Type: application/json' \
            --data '{"cv_text":"Python developer with Docker experience","job_description":"Python and Docker developer"}' | grep -E -q '"success"\s*:\s*true'
      - name: Stop model container
        if: always()
        run: docker rm --force model-3-ci || true
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push model 3 image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: docker push "$MODEL_3_IMAGE:$GITHUB_SHA"

      - name: Generate Model 3 CI Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### $ICON Model 3 (Skill Analyzer) Summary
          - **Status:** \`$STATUS\`
          - **Environment:** Python 3.11
          - **Checks Executed:** Syntax Check, Skill Extraction & Gap Analysis Tests
          - **Docker Image:** \`$MODEL_3_IMAGE:$GITHUB_SHA\`
          - **Service Healthcheck & API:** Port 5003 /health and /analyze
          EOF
          echo "=== Model 3 CI completed with status: $STATUS ==="

  model-4:
    name: Model 4 CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: model-4-chat-model
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Syntax & compilation check
        working-directory: model-4-chat-model
        run: python -m py_compile chat_model.py test_model.py
      - name: Unit and inference tests
        working-directory: model-4-chat-model
        run: python test_model.py
      - name: Build Docker image
        run: docker build --tag "$MODEL_4_IMAGE:$GITHUB_SHA" ./model-4-chat-model
      - name: Start model container
        run: docker run --detach --name model-4-ci --publish 5004:5004 "$MODEL_4_IMAGE:$GITHUB_SHA"
      - name: Validate model service
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5004/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs model-4-ci
          exit 1
      - name: Validate model API
        run: |
          curl --fail --silent --request POST http://127.0.0.1:5004/chat \
            --header 'Content-Type: application/json' \
            --data '{"question":"How can I improve my resume?"}' | grep -E -q '"success"\s*:\s*true'
      - name: Stop model container
        if: always()
        run: docker rm --force model-4-ci || true
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push model 4 image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: docker push "$MODEL_4_IMAGE:$GITHUB_SHA"

      - name: Generate Model 4 CI Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### $ICON Model 4 (Chat Assistant) Summary
          - **Status:** \`$STATUS\`
          - **Environment:** Python 3.11
          - **Checks Executed:** Syntax Check, Chat Coaching & Resume Prompt Inference Tests
          - **Docker Image:** \`$MODEL_4_IMAGE:$GITHUB_SHA\`
          - **Service Healthcheck & API:** Port 5004 /health and /chat
          EOF
          echo "=== Model 4 CI completed with status: $STATUS ==="

  integration:
    name: Full application integration CI
    needs: [frontend, backend, model-1, model-2, model-3, model-4]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Start complete Compose environment
        env:
          JWT_SECRET: ci-only-jwt-secret
        run: docker compose -f docker-compose.dev.yml up --detach --build
      - name: Validate service communication
        run: |
          for port in 5000 5001 5002 5003 5004 5174; do
            for attempt in $(seq 1 90); do
              if curl --fail --silent "http://127.0.0.1:$port/health" > /dev/null 2>&1 || { [ "$port" = 5174 ] && curl --fail --silent "http://127.0.0.1:$port/" > /dev/null 2>&1; }; then
                break
              fi
              sleep 2
            done
            curl --fail --silent "http://127.0.0.1:$port/$([ "$port" = 5174 ] && echo || echo health)" > /dev/null 2>&1 || { [ "$port" = 5174 ] || exit 1; }
          done
          curl --fail --silent http://127.0.0.1:5000/health > /dev/null
          curl --fail --silent http://127.0.0.1:5001/health > /dev/null
          curl --fail --silent http://127.0.0.1:5002/health > /dev/null
          curl --fail --silent http://127.0.0.1:5003/health > /dev/null
          curl --fail --silent http://127.0.0.1:5004/health > /dev/null
          curl --fail --silent http://127.0.0.1:5174/ > /dev/null
          docker compose -f docker-compose.dev.yml exec -T frontend node --input-type=module -e 'const response = await fetch("http://backend:5000/health"); if (!response.ok) process.exit(1);'
          docker compose -f docker-compose.dev.yml exec -T backend node --input-type=module <<'NODE'
          for (const port of [5001, 5002, 5003, 5004]) {
            const response = await fetch(`http://model-${port - 5000}:${port}/health`);
            if (!response.ok) throw new Error(`Model ${port} is unreachable from backend`);
          }
          NODE

      - name: Test Database Backup and Restore Scripts
        run: |
          chmod +x scripts/backup_db.sh scripts/restore_db.sh
          echo "🧪 Testing backup script..."
          MONGO_CONTAINER=mongodb ./scripts/backup_db.sh /tmp/ci_backups
          echo "🧪 Testing restore script..."
          MONGO_CONTAINER=mongodb ./scripts/restore_db.sh /tmp/ci_backups

      - name: Show Compose diagnostics
        if: failure()
        run: docker compose -f docker-compose.dev.yml ps && docker compose -f docker-compose.dev.yml logs
      - name: Stop complete Compose environment
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

      - name: Generate Integration CI Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### $ICON Full Application Integration Summary
          - **Status:** \`$STATUS\`
          - **Multi-Container Stack:** 6 Microservices (Frontend + Backend + Models 1..4)
          - **Inter-service Verification:**
            - Frontend ↔ Backend Communication: Verified
            - Backend ↔ Models (5001, 5002, 5003, 5004): Verified
            - Database Backup & Restore Automation: Verified
          EOF
          echo "=== Integration CI completed with status: $STATUS ==="

  # ============================================================
  # Continuous Deployment (CD) to AWS EC2
  # Runs ONLY if all CI checks and integration tests pass!
  # ============================================================
  deploy:
    name: CD - Deploy to AWS EC2
    needs: [integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG
          script: |
            set -e
            echo "🚀 Starting Continuous Deployment on AWS EC2..."
            
            # Navigate to the project directory
            cd ~/cv-app/CV || cd ~/CV || exit 1
            
            # 1. Pre-deployment Database Automated Backup
            echo "💾 Taking pre-deployment automated database backup..."
            chmod +x scripts/*.sh 2>/dev/null || true
            if [ -f "scripts/backup_db.sh" ]; then
              ./scripts/backup_db.sh ~/backups || echo "⚠️ Pre-deploy backup skipped (initial run)"
            fi
            
            # 2. Pull latest changes from git
            echo "📥 Pulling latest changes from repository..."
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            chmod +x scripts/*.sh 2>/dev/null || true
            
            # 3. Pull the exact images that passed CI from Docker Hub.
            echo "🐳 Pulling CI-approved production images from Docker Hub..."
            if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
              echo "❌ DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured for CD"
              exit 1
            fi
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml pull
            
            # 4. Start production containers
            echo "🚀 Starting production containers..."
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
            
            # 5. Import the repository snapshot once, after the first production start.
            # The marker prevents later deployments from overwriting live data.
            DB_IMPORT_MARKER="$HOME/.cv-db-dump-imported"
            if [ ! -f "$DB_IMPORT_MARKER" ] && [ -d "db_dump" ] && [ -f "db_dump/manifest.json" ]; then
              echo "📦 Importing initial database snapshot from db_dump..."
              docker cp db_dump cv-backend-prod:/app/db_dump
              docker cp Backend/scripts/import_db.js cv-backend-prod:/app/scripts/import_db.js
              docker exec -e MONGODB_URI=mongodb://mongodb:27017/cv_project_db cv-backend-prod node scripts/import_db.js
              touch "$DB_IMPORT_MARKER"
              echo "✅ Initial database snapshot imported successfully"
            elif [ -f "$DB_IMPORT_MARKER" ]; then
              echo "ℹ️ Database snapshot already imported; preserving production data"
            else
              echo "❌ db_dump/manifest.json is missing; refusing to mark database as imported"
              exit 1
            fi

            # 6. Confirm that the deployed API is healthy and connected to MongoDB.
            echo "🔎 Verifying deployed backend..."
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
                break
              fi
              sleep 2
            done
            curl --fail --silent http://127.0.0.1:5000/health > /dev/null
            
            # 7. Clean up old dangling images to preserve free tier disk space
            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f
            
            # 8. Verify containers status
            echo "📊 Verifying running containers..."
            docker compose -f docker-compose.prod.yml ps
            
            echo "✅ Deployment completed successfully!"

      - name: Generate CD Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### $ICON Continuous Deployment Summary
          - **Status:** \`$STATUS\`
          - **Target Server:** AWS EC2 (${{ secrets.EC2_HOST }})
          - **Triggered By:** \`${{ github.actor }}\` on branch \`${{ github.ref_name }}\`
          - **Image Tag:** \`${{ github.sha }}\` (exact CI commit)
          - **Database:** Initial repository snapshot imported once; subsequent deployments preserve the production volume
          - **Pre-deploy Backup:** \`~/backups/\` (Automated)
          - **Compose File:** \`docker-compose.prod.yml\`
          EOF

